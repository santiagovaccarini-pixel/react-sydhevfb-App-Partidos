name: Run extra time and dynamic substitutions

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ github.head_ref == 'agent/extra-time-dynamic-subs' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/extra-time-dynamic-subs
          persist-credentials: true

      - name: Apply patch
        run: python scripts/apply_extra_time_dynamic_subs.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build application
        run: npm run build

      - name: Clean validation artifacts
        run: |
          git checkout -- package.json
          rm -rf build
          rm -f scripts/apply_extra_time_dynamic_subs.py
          rmdir scripts 2>/dev/null || true

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Agrega prórroga y cambios dinámicos [extra-time-subs]"
          git push origin HEAD:agent/extra-time-dynamic-subs
