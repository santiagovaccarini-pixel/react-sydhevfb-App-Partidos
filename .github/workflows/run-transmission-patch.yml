name: Run transmission patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ github.head_ref == 'agent/transmission-mmmss' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/transmission-mmmss
          persist-credentials: true

      - name: Apply transmission patch
        run: python scripts/apply_transmission_mmmss.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build application
        run: npm run build

      - name: Remove temporary implementation files
        run: |
          rm -f scripts/apply_transmission_mmmss.py
          rm -f .github/workflows/apply-transmission-mmmss.yml
          rm -f .transmission-mmmss-trigger
          rmdir scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implementa tiempos de transmisión en MMM:SS [transmission-mmmss]"
          git push origin HEAD:agent/transmission-mmmss
