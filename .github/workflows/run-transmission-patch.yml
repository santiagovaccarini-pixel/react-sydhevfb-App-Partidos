name: Run transmission refinement

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refine-and-build:
    if: ${{ github.head_ref == 'agent/transmission-mmmss' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/transmission-mmmss
          persist-credentials: true

      - name: Apply refinement
        run: python scripts/refine_transmission_mmmss.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build application
        run: npm run build

      - name: Clean validation artifacts
        run: |
          git checkout -- package.json
          rm -rf build
          rm -f scripts/refine_transmission_mmmss.py
          rmdir scripts 2>/dev/null || true

      - name: Commit validated refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refina tiempos de transmisión y edición [transmission-refine]"
          git push origin HEAD:agent/transmission-mmmss
