name: Run restore mode card and version home

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ github.head_ref == 'agent/restore-mode-card-version-home' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-mode-card-version-home
          persist-credentials: true

      - name: Apply patch
        run: python scripts/restore_mode_card_version_home.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build application
        run: npm run build

      - name: Clean temporary files
        run: |
          git checkout -- package.json
          rm -rf build
          rm -f scripts/restore_mode_card_version_home.py
          rmdir scripts 2>/dev/null || true

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separa el modo activo del estado de versión"
          git push origin HEAD:agent/restore-mode-card-version-home
