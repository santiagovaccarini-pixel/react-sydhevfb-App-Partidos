name: Run version bottom and Rival orange

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ github.head_ref == 'agent/version-bottom-rival-orange' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/version-bottom-rival-orange
          persist-credentials: true

      - name: Apply patch
        run: python scripts/apply_version_bottom_rival_orange.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build application
        run: npm run build

      - name: Clean temporary files
        run: |
          git checkout -- package.json
          rm -rf build
          rm -f scripts/apply_version_bottom_rival_orange.py
          rmdir scripts 2>/dev/null || true

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mueve versión al pie y aplica colores Rival [version-rival]"
          git push origin HEAD:agent/version-bottom-rival-orange
