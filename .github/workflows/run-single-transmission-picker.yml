name: Run single transmission picker

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ github.head_ref == 'agent/single-transmission-picker' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/single-transmission-picker
          persist-credentials: true

      - name: Apply single picker patch
        run: python scripts/apply_single_transmission_picker.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build application
        run: npm run build

      - name: Clean validation artifacts
        run: |
          git checkout -- package.json
          rm -rf build
          rm -f package-lock.json
          rm -f scripts/apply_single_transmission_picker.py
          rmdir scripts 2>/dev/null || true

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Usa un único selector de minutos y segundos"
          git push origin HEAD:agent/single-transmission-picker
