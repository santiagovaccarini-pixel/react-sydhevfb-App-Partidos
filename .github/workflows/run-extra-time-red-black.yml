name: Run extra time red black palette

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ github.head_ref == 'agent/extra-time-red-black' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/extra-time-red-black
          persist-credentials: true

      - name: Apply palette patch
        run: python scripts/apply_red_black_extra_time.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build application
        run: npm run build

      - name: Clean validation artifacts
        run: |
          git checkout -- package.json
          rm -rf build
          rm -f scripts/apply_red_black_extra_time.py
          rmdir scripts 2>/dev/null || true

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cambia prórroga a paleta roja y negra"
          git push origin HEAD:agent/extra-time-red-black
