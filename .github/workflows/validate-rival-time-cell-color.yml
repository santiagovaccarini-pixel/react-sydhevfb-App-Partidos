name: Validate Rival time cell color

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ github.head_ref == 'agent/fix-rival-time-cell-color-clean' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone \
            --branch agent/fix-rival-time-cell-color-clean \
            --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repo

      - name: Apply visual fix
        working-directory: repo
        run: |
          if [ -f scripts/apply_fix_rival_time_cell_color.py ]; then
            python scripts/apply_fix_rival_time_cell_color.py
          else
            echo "Patch already applied"
          fi

      - name: Install dependencies
        working-directory: repo
        run: npm install --no-package-lock

      - name: Build application
        working-directory: repo
        run: npm run build

      - name: Clean validation artifacts
        working-directory: repo
        run: |
          git checkout -- package.json
          rm -rf build
          rm -f package-lock.json
          rm -f scripts/apply_fix_rival_time_cell_color.py
          rmdir scripts 2>/dev/null || true

      - name: Commit validated implementation
        working-directory: repo
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Corrige el color del tiempo en Rival"
            git push origin HEAD:agent/fix-rival-time-cell-color-clean
          else
            echo "No changes to commit"
          fi
