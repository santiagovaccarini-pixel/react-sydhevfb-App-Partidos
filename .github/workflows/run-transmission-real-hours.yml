name: Run transmission real hours

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ github.head_ref == 'agent/transmission-real-hours' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/transmission-real-hours
          persist-credentials: true

      - name: Apply transmission refinement
        run: python scripts/refine_transmission_real_hours.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build application
        run: npm run build

      - name: Clean validation artifacts
        run: |
          git checkout -- package.json
          rm -rf build
          rm -f .validation-trigger-refine
          rm -f scripts/refine_transmission_real_hours.py
          rmdir scripts 2>/dev/null || true

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige conversión final a horas reales [real-hours-refine]"
          git push origin HEAD:agent/transmission-real-hours
