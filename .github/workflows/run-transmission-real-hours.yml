name: Run transmission real hours

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ github.head_ref == 'agent/transmission-real-hours' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/transmission-real-hours
          persist-credentials: true

      - name: Correct patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_transmission_real_hours.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'prorroga: serializarProrroga(registroConHorasReales)',
              'prorroga: serializarProrroga(nuevoRegistro)',
          )
          text = text.replace(
              'prorroga: serializarProrroga(registroParaGuardar)',
              'prorroga: serializarProrroga(registroEditado)',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply transmission patch
        run: python scripts/apply_transmission_real_hours.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build application
        run: npm run build

      - name: Clean validation artifacts
        run: |
          git checkout -- package.json
          rm -rf build
          rm -f .validation-trigger
          rm -f scripts/apply_transmission_real_hours.py
          rmdir scripts 2>/dev/null || true

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guarda horas reales en transmisión [real-hours]"
          git push origin HEAD:agent/transmission-real-hours
