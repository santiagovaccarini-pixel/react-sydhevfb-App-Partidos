name: Run simplified mode update card

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ github.head_ref == 'agent/simplify-mode-update-card' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/simplify-mode-update-card
          persist-credentials: true

      - name: Correct patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/simplify_mode_update_card.py')
          text = path.read_text(encoding='utf-8')
          old = '''cantidad_avisos = app.count("          <AvisoActualizacion />\\n")
          if cantidad_avisos != 2:
              raise RuntimeError(
                  f"avisos separados: se esperaban 2 y se encontraron {cantidad_avisos}"
              )
          app = app.replace("          <AvisoActualizacion />\\n", "")'''
          new = '''cantidad_avisos = app.count("<AvisoActualizacion />")
          if cantidad_avisos != 3:
              raise RuntimeError(
                  f"avisos separados: se esperaban 3 y se encontraron {cantidad_avisos}"
              )
          app = app.replace("          <AvisoActualizacion />\\n", "")
          app = app.replace("        <AvisoActualizacion />\\n", "")
          app = app.replace("      <AvisoActualizacion />\\n", "")'''
          if old not in text:
              raise RuntimeError('No se encontró el bloque de avisos para corregir')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply patch
        run: python scripts/simplify_mode_update_card.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build application
        run: npm run build

      - name: Clean temporary files
        run: |
          git checkout -- package.json
          rm -rf build
          rm -f scripts/simplify_mode_update_card.py
          rm -f .simplify-mode-trigger
          rm -f .simplify-mode-trigger-2
          rmdir scripts 2>/dev/null || true

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplifica indicador y actualización de versión"
          git push origin HEAD:agent/simplify-mode-update-card
