name: Run scroll time and name selectors

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ github.head_ref == 'agent/scroll-time-name-selectors' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/scroll-time-name-selectors
          persist-credentials: true

      - name: Refine selector behavior
        run: python scripts/refine_scroll_selectors.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build application
        run: npm run build

      - name: Clean validation artifacts
        run: |
          git checkout -- package.json
          rm -rf build
          rm -f .selector-validation-trigger
          rm -f scripts/refine_scroll_selectors.py
          rmdir scripts 2>/dev/null || true

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refina selectores de nombres [scroll-selectors-refine]"
          git push origin HEAD:agent/scroll-time-name-selectors
